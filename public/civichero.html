<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Civic Hero - My City</title>
    
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; }
        
        /* Rank Card Gradient */
        .rank-card { background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%); color: white; }
        
        /* Animations */
        .animate-up { animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        .progress-bar { transition: width 1.5s ease-out; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, query, where, getDocs, getDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyCRXSzDVymPLQRjHwJuwh3nYC0FjtLys5o",
          authDomain: "civic-36b64.firebaseapp.com",
          projectId: "civic-36b64",
          storageBucket: "civic-36b64.firebasestorage.app",
          messagingSenderId: "946072651938",
          appId: "1:946072651938:web:90652f9faa6e94313eeffb",
          measurementId: "G-7GR579K7FF"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        window.fb = { auth, db, onAuthStateChanged, collection, query, where, getDocs, getDoc, doc };
    </script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function HeroPage() {
            const [user, setUser] = useState(null);
            const [profile, setProfile] = useState(null);
            const [stats, setStats] = useState({ reports: 0, xp: 0, nextLevel: 100, rank: "Citizen" });
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                window.fb.onAuthStateChanged(window.fb.auth, async (u) => {
                    if (u) {
                        setUser(u);
                        const docSnap = await window.fb.getDoc(window.fb.doc(window.fb.db, "users", u.uid));
                        if(docSnap.exists()) setProfile(docSnap.data());

                        const q = window.fb.query(window.fb.collection(window.fb.db, "issues"), window.fb.where("userId", "==", u.uid));
                        const querySnapshot = await window.fb.getDocs(q);
                        const count = querySnapshot.size;
                        
                        // Simple Logic
                        const xp = count * 50; 
                        let rank = "Citizen";
                        let next = 100;

                        if (xp >= 100) { rank = "Watcher"; next = 300; }
                        if (xp >= 300) { rank = "Guardian"; next = 600; }
                        if (xp >= 600) { rank = "Hero"; next = 1000; }
                        if (xp >= 1000) { rank = "Legend"; next = 5000; }

                        setStats({ reports: count, xp, nextLevel: next, rank });
                    }
                    setLoading(false);
                });
            }, []);

            // Badges Data
            const badges = [
                { name: "First Step", desc: "Report 1 Issue", icon: "fa-flag", unlocked: stats.reports >= 1 },
                { name: "Fixer", desc: "Report 5 Issues", icon: "fa-wrench", unlocked: stats.reports >= 5 },
                { name: "Road Warrior", desc: "Pothole Expert", icon: "fa-road", unlocked: stats.reports >= 3 },
                { name: "Eco Guardian", desc: "Cleaned Garbage", icon: "fa-leaf", unlocked: stats.reports >= 2 },
            ];

            // Leaderboard Data - Switched to Initials API to avoid Gender Mismatch
            const leaderboard = [
                { name: "Karthik R.", score: 2450, rank: 1, img: "https://ui-avatars.com/api/?name=Karthik+R&background=0D8ABC&color=fff&rounded=true" },
                { name: "Anitha S.", score: 2100, rank: 2, img: "https://ui-avatars.com/api/?name=Anitha+S&background=E91E63&color=fff&rounded=true" },
                { name: "Muthu Kumar", score: 1850, rank: 3, img: "https://ui-avatars.com/api/?name=Muthu+Kumar&background=FF9800&color=fff&rounded=true" },
                { name: "Divya P.", score: 1200, rank: 4, img: "https://ui-avatars.com/api/?name=Divya+P&background=9C27B0&color=fff&rounded=true" },
                { name: "Senthil V.", score: 950, rank: 5, img: "https://ui-avatars.com/api/?name=Senthil+V&background=4CAF50&color=fff&rounded=true" },
            ];

            const progressPercent = Math.min((stats.xp / stats.nextLevel) * 100, 100);

            // Fallback for User Profile Image
            const userImage = profile?.photoURL || `https://ui-avatars.com/api/?name=${profile?.name || 'User'}&background=random&color=fff&rounded=true`;

            if (loading) return <div className="min-h-screen flex items-center justify-center"><div className="w-8 h-8 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div></div>;

            return (
                <div className="min-h-screen bg-gray-50 pb-10">
                    
                    {/* Header */}
                    <div className="bg-white p-4 flex items-center gap-3 border-b sticky top-0 z-10 shadow-sm">
                        <button onClick={() => window.location.href='index.html'} className="p-2 hover:bg-gray-100 rounded-full transition"><i className="fas fa-arrow-left text-gray-600"></i></button>
                        <h1 className="font-bold text-lg text-gray-800">Civic Hero</h1>
                    </div>

                    <div className="p-6 animate-up">
                        
                        {/* 1. RANK CARD */}
                        <div className="rank-card rounded-3xl p-6 relative overflow-hidden shadow-xl mb-8">
                            {/* Background Pattern */}
                            <div className="absolute top-0 right-0 w-32 h-32 bg-white/10 rounded-full blur-2xl -mr-10 -mt-10"></div>
                            
                            <div className="flex items-center gap-4 mb-6 relative z-10">
                                <div className="p-1 bg-white/20 rounded-full">
                                    <img src={userImage} className="w-16 h-16 rounded-full border-2 border-white" />
                                </div>
                                <div>
                                    <p className="text-blue-100 text-xs font-bold uppercase tracking-wider mb-0.5">Current Rank</p>
                                    <h1 className="text-3xl font-black text-white">{stats.rank}</h1>
                                </div>
                            </div>

                            <div className="flex justify-between text-xs font-bold text-blue-100 mb-2">
                                <span>{stats.xp} XP</span>
                                <span>{stats.nextLevel} XP</span>
                            </div>
                            <div className="h-3 bg-black/20 rounded-full overflow-hidden">
                                <div className="h-full bg-yellow-400 progress-bar shadow-[0_0_10px_rgba(250,204,21,0.5)]" style={{ width: `${progressPercent}%` }}></div>
                            </div>
                            <p className="text-[10px] text-blue-200 mt-2 text-center">Earn {stats.nextLevel - stats.xp} more XP to reach next level!</p>
                        </div>

                        {/* 2. STATS */}
                        <div className="grid grid-cols-2 gap-4 mb-8">
                            <div className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 text-center">
                                <div className="w-10 h-10 mx-auto bg-blue-50 text-blue-600 rounded-full flex items-center justify-center text-lg mb-2"><i className="fas fa-flag"></i></div>
                                <h2 className="text-2xl font-bold text-gray-800">{stats.reports}</h2>
                                <p className="text-xs text-gray-400 font-bold uppercase">Reports</p>
                            </div>
                            <div className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 text-center">
                                <div className="w-10 h-10 mx-auto bg-green-50 text-green-600 rounded-full flex items-center justify-center text-lg mb-2"><i className="fas fa-users"></i></div>
                                <h2 className="text-2xl font-bold text-gray-800">{stats.reports * 12}</h2>
                                <p className="text-xs text-gray-400 font-bold uppercase">Impact Score</p>
                            </div>
                        </div>

                        {/* 3. LEADERBOARD (Clean Initials) */}
                        <div className="mb-8">
                            <div className="flex items-center justify-between mb-4">
                                <h3 className="font-bold text-gray-800 text-lg">District Top 5</h3>
                                <span className="text-xs font-bold text-blue-600 bg-blue-50 px-2 py-1 rounded-lg">This Week</span>
                            </div>
                            
                            <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                                {leaderboard.map((person, index) => (
                                    <div key={index} className="flex items-center gap-4 p-4 border-b border-gray-50 last:border-0 hover:bg-gray-50 transition">
                                        <div className={`w-6 text-center font-bold ${index === 0 ? 'text-yellow-500 text-xl' : index === 1 ? 'text-gray-400 text-lg' : index === 2 ? 'text-orange-400 text-lg' : 'text-gray-400 text-sm'}`}>
                                            {index < 3 ? <i className="fas fa-crown"></i> : `#${person.rank}`}
                                        </div>
                                        <img src={person.img} className="w-10 h-10 rounded-full" />
                                        <div className="flex-1">
                                            <h4 className="font-bold text-gray-800 text-sm">{person.name}</h4>
                                            <p className="text-[10px] text-gray-400">Citizen Level 4</p>
                                        </div>
                                        <div className="font-mono font-bold text-blue-600 text-sm">{person.score} XP</div>
                                    </div>
                                ))}
                                
                                {/* User's Rank (Sticky at bottom) */}
                                <div className="bg-blue-50 p-4 flex items-center gap-4 border-t border-blue-100">
                                    <div className="w-6 text-center font-bold text-blue-600 text-sm">#12</div>
                                    <img src={userImage} className="w-10 h-10 rounded-full border-2 border-white" />
                                    <div className="flex-1">
                                        <h4 className="font-bold text-gray-800 text-sm">You</h4>
                                    </div>
                                    <div className="font-mono font-bold text-blue-600 text-sm">{stats.xp} XP</div>
                                </div>
                            </div>
                        </div>

                        {/* 4. BADGES */}
                        <h3 className="font-bold text-gray-800 text-lg mb-4">My Badges</h3>
                        <div className="space-y-3">
                            {badges.map((badge, i) => (
                                <div key={i} className={`p-4 rounded-xl flex items-center gap-4 border transition ${badge.unlocked ? 'bg-white border-blue-100 shadow-sm' : 'bg-gray-50 border-gray-100 opacity-60'}`}>
                                    <div className={`w-12 h-12 rounded-full flex items-center justify-center text-xl ${badge.unlocked ? 'bg-blue-100 text-blue-600' : 'bg-gray-200 text-gray-400'}`}>
                                        <i className={`fas ${badge.icon}`}></i>
                                    </div>
                                    <div className="flex-1">
                                        <h4 className="font-bold text-gray-800 text-sm">{badge.name}</h4>
                                        <p className="text-xs text-gray-500">{badge.desc}</p>
                                    </div>
                                    {badge.unlocked ? <i className="fas fa-check-circle text-green-500"></i> : <i className="fas fa-lock text-gray-300"></i>}
                                </div>
                            ))}
                        </div>

                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<HeroPage />);
    </script>
</body>
</html>
