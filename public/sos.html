<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency SOS - My City</title>
    
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #1a1a1a; color: white; }
        /* Urgent Red Gradient Background */
        .bg-urgent { background: linear-gradient(180deg, #991b1b 0%, #1a1a1a 40%); min-height: 100vh; }
        
        /* Pulse Animation for SOS */
        .pulse-ring { position: relative; }
        .pulse-ring::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; border-radius: 50%; border: 2px solid rgba(255, 100, 100, 0.5); animation: pulse-animation 2s infinite; z-index: -1; }
        @keyframes pulse-animation { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }

        .loader { border: 3px solid rgba(255,255,255,0.3); border-top: 3px solid white; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .slide-up { animation: slideUp 0.4s ease-out; }
        @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyCRXSzDVymPLQRjHwJuwh3nYC0FjtLys5o",
          authDomain: "civic-36b64.firebaseapp.com",
          projectId: "civic-36b64",
          storageBucket: "civic-36b64.firebasestorage.app",
          messagingSenderId: "946072651938",
          appId: "1:946072651938:web:90652f9faa6e94313eeffb",
          measurementId: "G-7GR579K7FF"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        window.fb = { auth, db, onAuthStateChanged, collection, addDoc, getDoc, doc };
    </script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function EmergencyPage() {
            const [user, setUser] = useState(null);
            const [profile, setProfile] = useState(null);
            const [location, setLocation] = useState(null);
            const [loading, setLoading] = useState(false);
            const [sent, setSent] = useState(false);

            useEffect(() => {
                window.fb.onAuthStateChanged(window.fb.auth, async (u) => {
                    if (u) {
                        setUser(u);
                        const docSnap = await window.fb.getDoc(window.fb.doc(window.fb.db, "users", u.uid));
                        if(docSnap.exists()) setProfile(docSnap.data());
                    }
                });
                if (navigator.geolocation) navigator.geolocation.getCurrentPosition(pos => setLocation({lat: pos.coords.latitude, lng: pos.coords.longitude}));
            }, []);

            const reportHazard = async (type, icon) => {
                if(!confirm(`⚠️ REPORT EMERGENCY: ${type}?\n\nThis will alert authorities immediately.`)) return;
                
                setLoading(true);
                try {
                    await window.fb.addDoc(window.fb.collection(window.fb.db, "issues"), {
                        userId: user ? user.uid : "ANONYMOUS",
                        district: profile ? profile.district : "Unknown",
                        category: type,
                        severity: 5, // CRITICAL
                        description: "🚨 SOS HAZARD REPORTED VIA EMERGENCY MODULE",
                        location: location || "GPS Not Locked",
                        status: "CRITICAL",
                        timestamp: new Date(),
                        isEmergency: true
                    });
                    setSent(true);
                    setTimeout(() => setSent(false), 4000);
                } catch(e) { alert("Error sending report"); }
                setLoading(false);
            };

            const hazards = [
                { name: "Fire / Gas Leak", icon: "fa-fire", color: "bg-orange-500" },
                { name: "Live Wire", icon: "fa-bolt", color: "bg-yellow-500" },
                { name: "Open Manhole", icon: "fa-circle-notch", color: "bg-gray-500" },
                { name: "Building Collapse", icon: "fa-house-damage", color: "bg-stone-600" },
                { name: "Major Flood", icon: "fa-water", color: "bg-blue-500" },
                { name: "Fallen Tree", icon: "fa-tree", color: "bg-green-600" },
                { name: "Road Accident", icon: "fa-car-crash", color: "bg-red-600" }
            ];

            return (
                <div className="bg-urgent pb-10">
                    {/* Header */}
                    <div className="flex items-center justify-between p-5 sticky top-0 z-20 backdrop-blur-md bg-black/20 border-b border-white/10">
                        <button onClick={() => window.location.href='index.html'} className="w-10 h-10 bg-white/10 rounded-full flex items-center justify-center backdrop-blur-md hover:bg-white/20 transition">
                            <i className="fas fa-arrow-left text-white"></i>
                        </button>
                        <div className="text-center">
                            <h1 className="font-black text-xl tracking-wider text-white">SOS MODE</h1>
                            <div className="flex items-center justify-center gap-1.5 mt-0.5">
                                <span className="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
                                <span className="text-[10px] font-bold text-green-400 uppercase tracking-widest">Live Connection</span>
                            </div>
                        </div>
                        <div className="w-10"></div> {/* Spacer */}
                    </div>

                    <div className="p-6 slide-up">
                        
                        {/* SECTION 1: ONE-TAP CALL (PULSE ANIMATION) */}
                        <div className="text-center mb-8">
                            <h2 className="text-xs font-bold text-red-200 uppercase tracking-widest mb-4">Tap to Dial Immediately</h2>
                            <div className="flex justify-center gap-4">
                                <a href="tel:100" className="pulse-ring w-24 h-24 bg-red-600 rounded-full flex flex-col items-center justify-center shadow-2xl shadow-red-900 active:scale-90 transition transform">
                                    <i className="fas fa-shield-alt text-2xl mb-1"></i>
                                    <span className="text-xs font-bold">POLICE</span>
                                    <span className="text-[10px] opacity-75">100</span>
                                </a>
                                <a href="tel:108" className="w-24 h-24 bg-white text-red-600 rounded-full flex flex-col items-center justify-center shadow-xl active:scale-90 transition transform">
                                    <i className="fas fa-ambulance text-2xl mb-1"></i>
                                    <span className="text-xs font-bold">MEDIC</span>
                                    <span className="text-[10px] opacity-75">108</span>
                                </a>
                                <a href="tel:101" className="w-24 h-24 bg-orange-600 rounded-full flex flex-col items-center justify-center shadow-xl active:scale-90 transition transform">
                                    <i className="fas fa-fire-extinguisher text-2xl mb-1"></i>
                                    <span className="text-xs font-bold">FIRE</span>
                                    <span className="text-[10px] opacity-75">101</span>
                                </a>
                            </div>
                        </div>

                        {/* SECTION 2: 7 HAZARD GRID */}
                        <div className="bg-white/5 backdrop-blur-xl rounded-3xl p-6 border border-white/10">
                            <div className="flex items-center justify-between mb-4">
                                <h2 className="font-bold text-lg text-white">Report Hazard</h2>
                                <span className="text-[10px] bg-red-600 px-2 py-1 rounded text-white font-bold">CRITICAL</span>
                            </div>
                            
                            <div className="grid grid-cols-2 gap-3">
                                {hazards.map((h, i) => (
                                    <button 
                                        key={i} 
                                        onClick={() => reportHazard(h.name)} 
                                        className={`bg-white/10 hover:bg-white/20 border border-white/5 p-4 rounded-xl flex flex-col items-center justify-center gap-2 transition active:scale-95 ${i === 6 ? 'col-span-2 flex-row gap-3' : ''}`}
                                    >
                                        <div className={`${h.color} w-10 h-10 rounded-full flex items-center justify-center shadow-lg`}>
                                            <i className={`fas ${h.icon} text-white text-sm`}></i>
                                        </div>
                                        <span className="text-xs font-bold text-gray-200">{h.name}</span>
                                    </button>
                                ))}
                            </div>
                        </div>

                        <p className="text-center text-[10px] text-gray-500 mt-6 max-w-xs mx-auto">
                            False reporting of emergencies is a punishable offense. Your IP and GPS are being logged.
                        </p>
                    </div>

                    {/* SUCCESS OVERLAY */}
                    {sent && (
                        <div className="fixed inset-0 bg-black/90 z-50 flex flex-col items-center justify-center text-center p-8 animate-in fade-in zoom-in duration-300">
                            <div className="w-24 h-24 bg-green-500 rounded-full flex items-center justify-center mb-6 shadow-2xl shadow-green-500/50">
                                <i className="fas fa-check text-4xl text-white"></i>
                            </div>
                            <h2 className="text-2xl font-black text-white mb-2">ALERT SENT</h2>
                            <p className="text-gray-300">Authorities have been notified.<br/>Help is on the way.</p>
                            <div className="mt-8 text-xs text-gray-500">Redirecting...</div>
                        </div>
                    )}
                    
                    {/* LOADING */}
                    {loading && <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50"><div className="loader"></div></div>}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<EmergencyPage />);
    </script>
</body>
</html>
