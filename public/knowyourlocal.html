<!DOCTYPE html>
<html lang="en">
<head>

    </style>
</head>

        const firebaseConfig = {

                "Perambalur": { mp: "T.R. Paarivendhar (IJK)", collector: "P. Sri Venkata Priya IAS", police: "04328-225300", const: [{n: "Perambalur", m: "M. Prabhakaran", p: "DMK"}, {n: "Kunnam", m: "S.S. Sivasankar", p: "DMK"}] },
                "Pudukkottai": { mp: "S. Thirunavukkarasar (INC)", collector: "Kavitha Ramu IAS", police: "04322-221800", const: [{n: "Pudukkottai", m: "V. Muthuraja", p: "DMK"}, {n: "Aranthangi", m: "T. Ramachandran", p: "INC"}] },
                "Ramanathapuram": { mp: "K. Navas Kani (IUML)", collector: "Johny Tom Varghese IAS", police: "04567-230000", const: [{n: "Ramanathapuram", m: "K. Muthuramalingam", p: "DMK"}, {n: "Paramakudi", m: "S. Murugesan", p: "DMK"}] },
                "Ranipet": { mp: "S. Jagathrakshakan (DMK)", collector: "D. Baskara Pandian IAS", police: "04172-271000", const: [{n: "Ranipet", m: "R. Gandhi", p: "DMK"}, {n: "Arcot", m: "J.L. Eswarappan", p: "DMK"}] },
                "Salem": { mp: "S.R. Parthiban (DMK)", collector: "S. Karmegam IAS", police: "0427-2451313", const: [{n: "Salem North", m: "R. Rajendran", p: "DMK"}, {n: "Salem South", m: "E. Balasubramanian", p: "AIADMK"}] },
                "Sivaganga": { mp: "Karti P. Chidambaram (INC)", collector: "P. Madhusudhan Reddy IAS", police: "04575-240444", const: [{n: "Sivaganga", m: "P.R. Senthilnathan", p: "AIADMK"}, {n: "Karaikudi", m: "S. Mangudi", p: "INC"}] },
                "Tenkasi": { mp: "Dhanush M. Kumar (DMK)", collector: "P. Akash IAS", police: "04633-222222", const: [{n: "Tenkasi", m: "S. Palani Nadar", p: "INC"}, {n: "Sankarankovil", m: "E. Raja", p: "DMK"}] },
                "Thanjavur": { mp: "S.S. Palanimanickam (DMK)", collector: "Dinesh Ponraj Oliver IAS", police: "04362-230000", const: [{n: "Thanjavur", m: "T.K.G. Neelamegam", p: "DMK"}, {n: "Kumbakonam", m: "G. Anbalagan", p: "DMK"}] },
                "Theni": { mp: "P. Raveendranath Kumar (AIADMK)", collector: "R.V. Shajeevana IAS", police: "04546-252000", const: [{n: "Bodinayakkanur", m: "O. Panneerselvam", p: "AIADMK"}, {n: "Cumbum", m: "N. Eramakrishnan", p: "DMK"}] },
                "Thoothukudi": { mp: "Kanimozhi Karunanidhi (DMK)", collector: "K. Senthil Raj IAS", police: "0461-2340000", const: [{n: "Thoothukudi", m: "P. Geetha Jeevan", p: "DMK"}, {n: "Kovilpatti", m: "Kadambur C. Raju", p: "AIADMK"}] },
                "Tiruchirappalli": { mp: "Su. Thirunavukkarasar (INC)", collector: "M. Pradeep Kumar IAS", police: "0431-2333333", const: [{n: "Trichy West", m: "K.N. Nehru", p: "DMK"}, {n: "Trichy East", m: "Inigo Irudayaraj", p: "DMK"}] },

                "Tiruvallur": { mp: "K. Jayakumar (INC)", collector: "Alby John Varghese IAS", police: "044-27661000", const: [{n: "Tiruvallur", m: "V.G. Raajendran", p: "DMK"}, {n: "Avadi", m: "S.M. Nasar", p: "DMK"}] },

                "Virudhunagar": { mp: "B. Manickam Tagore (INC)", collector: "J. Meghanatha Reddy IAS", police: "04562-252000", const: [{n: "Virudhunagar", m: "A.R.R. Seenivasan", p: "DMK"}, {n: "Sivakasi", m: "A.M.S.G. Ashokan", p: "INC"}] }
            };

            const ALL_DISTRICTS = Object.keys(ALL_TN_DATA).sort();

            useEffect(() => {
                window.fb.onAuthStateChanged(window.fb.auth, async (u) => {
                    if (u) {
                        const docSnap = await window.fb.getDoc(window.fb.doc(window.fb.db, "users", u.uid));
                        if (docSnap.exists()) {
                            const d = docSnap.data().district || "Coimbatore";
                            const validDistrict = ALL_TN_DATA[d] ? d : "Coimbatore";
                            setDistrict(validDistrict);
                            updateData(validDistrict);
                        }
                    } else {
                        updateData("Coimbatore");
                    }
                    setLoading(false);
                });
            }, []);

            const updateData = (dist) => {
                const data = ALL_TN_DATA[dist];
                setLocalData(data);
                setConstituency(data.const[0].n);
            };

            const handleDistrictChange = (e) => {
                const d = e.target.value;
                setDistrict(d);
                updateData(d);
            };

            const handleCallMLA = (mlaName) => {
                const confirmCall = confirm(`Dialing Office of ${mlaName}?\n(Redirecting to Official Public Helpline)`);
                if (confirmCall) {
                    window.location.href = "tel:1913"; // Public Grievance Helpline
                }
            };

            if (loading) return <div className="h-screen flex items-center justify-center"><div className="w-8 h-8 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div></div>;

            const selectedMLA = localData.const.find(c => c.n === constituency) || localData.const[0];

                            </div>

                                <select value={constituency} onChange={(e) => setConstituency(e.target.value)} className="w-full p-3 bg-white border border-blue-200 rounded-xl text-sm font-bold text-blue-700 outline-none focus:border-blue-500 appearance-none">
                                    {localData.const.map(c => <option key={c.n} value={c.n}>{c.n}</option>)}
                                </select>
                                <i className="fas fa-chevron-down absolute right-3 top-4 text-xs text-blue-400 pointer-events-none"></i>
                            </div>
                        </div>
                    </div>

                    <div className="p-6 max-w-lg mx-auto animate-up space-y-6">

                        {/* 1. MLA CARD (Detailed - No WhatsApp) */}
                        <div>
                            <div className="flex items-center gap-2 mb-3">
                                <span className="w-2 h-6 bg-green-500 rounded-full"></span>
                                <h3 className="font-bold text-gray-800">Your MLA</h3>
                                <span className="ml-auto text-[10px] bg-green-100 text-green-700 px-2 py-0.5 rounded-full font-bold uppercase tracking-wider">Verified</span>
                            </div>
                            
                            <div className="card-official bg-white rounded-2xl shadow-lg border border-green-50 overflow-hidden relative">
                                <div className="absolute top-0 right-0 w-32 h-32 bg-green-50 rounded-full -mr-10 -mt-10 blur-2xl opacity-50"></div>
                                
                                <div className="p-6 relative z-10">
                                    <h2 className="text-2xl font-black text-gray-800 leading-tight mb-1">{selectedMLA.m}</h2>
                                    <div className="flex items-center gap-2 mb-4">
                                        <span className="bg-gray-100 text-gray-600 text-[10px] font-bold px-2 py-1 rounded uppercase">{selectedMLA.p} Party</span>
                                        <span className="text-xs text-gray-400 font-medium">• {selectedMLA.n} Constituency</span>
                                    </div>
                                    
                                    <button 
                                        onClick={() => handleCallMLA(selectedMLA.m)}
                                        className="w-full bg-green-600 text-white py-4 rounded-xl text-sm font-bold shadow-lg shadow-green-200 flex items-center justify-center gap-3 active:scale-95 transition"
                                    >
                                        <i className="fas fa-phone-alt"></i> Call Official Office
                                    </button>
                                </div>
                            </div>
                        </div>

                        {/* 2. MP CARD */}
                        <div>
                            <div className="flex items-center gap-2 mb-3">
                                <span className="w-2 h-6 bg-orange-500 rounded-full"></span>
                                <h3 className="font-bold text-gray-800">Member of Parliament</h3>
                            </div>
                            <div className="bg-white p-5 rounded-2xl shadow-sm border border-orange-100 flex items-center gap-4">
                                <div className="w-14 h-14 rounded-full bg-orange-50 flex items-center justify-center text-orange-500 text-2xl border-2 border-white shadow-sm flex-shrink-0">
                                    <i className="fas fa-landmark"></i>
                                </div>
                                <div className="flex-1">
                                    <h4 className="font-bold text-gray-800 text-sm">{localData.mp}</h4>
                                    <p className="text-[10px] text-gray-400 font-bold uppercase tracking-wider">{district} District</p>
                                </div>
                                <button className="w-10 h-10 rounded-full bg-gray-50 text-gray-400 flex items-center justify-center hover:bg-orange-50 hover:text-orange-600 transition">
                                    <i className="fas fa-info-circle"></i>
                                </button>
                            </div>
                        </div>

                        {/* 3. OFFICIALS & EMERGENCY */}
                        <div>
                            <div className="flex items-center gap-2 mb-3">
                                <span className="w-2 h-6 bg-slate-700 rounded-full"></span>
                                <h3 className="font-bold text-gray-800">District Officials</h3>
                            </div>
                            
                            <div className="space-y-3">
                                {/* Collector Card with Google Calendar */}
                                <div className="bg-slate-800 text-white p-4 rounded-xl shadow-lg flex items-center justify-between">
                                    <div className="flex items-center gap-3">
                                        <div className="w-10 h-10 bg-white/10 rounded-full flex items-center justify-center"><i className="fas fa-briefcase"></i></div>
                                        <div>
                                            <h4 className="font-bold text-sm">District Collector</h4>
                                            <p className="text-xs text-slate-400">{localData.collector}</p>
                                        </div>
                                    </div>
                                    <div className="text-right flex flex-col items-end">
                                        <div className="text-[10px] text-slate-400 mb-1">Grievance Day</div>
                                        <a 
                                            href={`https://calendar.google.com/calendar/render?action=TEMPLATE&text=Grievance+Day+Meeting&dates=20241028T100000Z/20241028T110000Z&details=Meeting+with+${localData.collector}+at+Collectorate.&location=${district}+Collector+Office&sf=true&output=xml`}
                                            target="_blank"
                                            className="bg-white/20 px-2 py-1 rounded text-[10px] font-bold hover:bg-blue-600 transition flex items-center gap-1"
                                        >
                                            <i className="far fa-calendar-plus"></i> Mon 10 AM
                                        </a>
                                    </div>
                                </div>

                                {/* Police */}
                                <div className="bg-white border border-red-100 p-4 rounded-xl flex items-center justify-between shadow-sm">
                                    <div className="flex items-center gap-3">
                                        <div className="w-10 h-10 bg-red-50 text-red-600 rounded-full flex items-center justify-center"><i className="fas fa-shield-alt"></i></div>
                                        <div>
                                            <h4 className="font-bold text-gray-800 text-sm">Police Control Room</h4>
                                            <p className="text-xs text-gray-500">{district} HQ</p>
                                        </div>
                                    </div>
                                    <a href={`tel:${localData.police}`} className="flex flex-col items-center gap-1">
                                        <div className="w-8 h-8 rounded-full bg-red-600 text-white flex items-center justify-center shadow-lg shadow-red-200"><i className="fas fa-phone"></i></div>
                                    </a>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<KnowYourLocal />);
    </script>
</body>
</html>
